[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-audit"
version = "0.1.0"
description = "Audit your website across four pillars: Privacy, Security, Accessibility, and Performance."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Polaris Audit" },
]
keywords = ["audit", "website", "privacy", "security", "accessibility", "performance", "gdpr", "wcag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "requests>=2.31.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
js = ["playwright>=1.47.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
polaris = "polaris_audit.cli:main"

[project.urls]
Homepage = "https://github.com/polaris-audit/polaris-audit"
Issues = "https://github.com/polaris-audit/polaris-audit/issues"

[tool.setuptools.packages.find]
include = ["polaris_audit*"]

[tool.setuptools.package-data]
polaris_audit = ["config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
